<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Strategica Europea - Soldateria Italiana</title>
    
    <!-- Font Romano + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Leaflet CSS per la mappa interattiva -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', sans-serif;
            background-color: #140608;
            color: #f5f0e6;
            overflow: hidden;
        }

        /* Barra superiore con Nome Utente e Grado */
        .top-bar {
            background: rgba(54, 14, 19, 0.95);
            border-bottom: 1.5px solid #d4af37;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            color: #d4af37;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            border: 1px solid rgba(212, 175, 55, 0.5);
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #d4af37;
            color: #2b090d;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: #d4af37;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* Box Identità Soldato in alto */
        .user-badge {
            background: rgba(20, 6, 8, 0.75);
            border: 1px solid rgba(212, 175, 55, 0.6);
            border-radius: 8px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }

        .user-name {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: #ffd700;
        }

        .user-rank {
            background: rgba(212, 175, 55, 0.18);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #f5f0e6;
        }

        /* Contenitore Mappa */
        #map-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #12080a;
        }

        /* Riquadro informativo regione selezionata (in basso su mobile/desktop) */
        .region-info-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(54, 14, 19, 0.92);
            border: 1.5px solid #d4af37;
            border-radius: 10px;
            padding: 12px 20px;
            z-index: 1000;
            text-align: center;
            min-width: 260px;
            max-width: 90%;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            pointer-events: none;
        }

        .region-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #e5c158;
            font-family: 'Cinzel', serif;
            margin-bottom: 3px;
        }

        .region-name {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .region-sub {
            font-size: 0.78rem;
            color: #cfc5b4;
            margin-top: 2px;
        }

        /* Personalizzazione Popup Leaflet */
        .leaflet-popup-content-wrapper {
            background: rgba(54, 14, 19, 0.95);
            color: #f5f0e6;
            border: 1px solid #d4af37;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
        }

        .leaflet-popup-tip {
            background: #d4af37;
        }

        .popup-title {
            font-family: 'Cinzel', serif;
            color: #ffd700;
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* Schermata di caricamento */
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(20, 6, 8, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            font-family: 'Cinzel', serif;
            color: #d4af37;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <!-- Barra superiore con Utente e Grado -->
    <header class="top-bar">
        <div class="title-area">
            <a href="index.html" class="back-btn">← Comando</a>
            <h1>Mappa Europea</h1>
        </div>

        <div class="user-badge" id="user-box">
            <span class="user-name" id="soldier-name">Ospite</span>
            <span class="user-rank" id="soldier-rank">Non Arruolato</span>
        </div>
    </header>

    <!-- Area Mappa -->
    <div id="map-wrapper">
        <div id="loading-overlay">CARICAMENTO SETTORI EUROPEI...</div>
        <div id="map"></div>

        <!-- Box fisso in basso che mostra la regione toccata -->
        <div class="region-info-box">
            <div class="region-label">Settore Selezionato</div>
            <div class="region-name" id="selected-region-name">Tocca una regione</div>
            <div class="region-sub" id="selected-region-country">Esplora il teatro operativo europeo</div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Firebase SDK per caricare Nome Utente e Grado -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCtSgXFtxyh5nOTw_LJYUQWxirKDEI5qRA",
            authDomain: "soldateria-italiana.firebaseapp.com",
            projectId: "soldateria-italiana",
            storageBucket: "soldateria-italiana.firebasestorage.app",
            messagingSenderId: "796071358350",
            appId: "1:796071358350:web:550d693197abee8f4e3edf",
            measurementId: "G-ZLK81VSLPG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const soldierNameEl = document.getElementById('soldier-name');
        const soldierRankEl = document.getElementById('soldier-rank');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, "soldati", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        soldierNameEl.textContent = data.nickname || user.displayName || "Soldato";
                        soldierRankEl.textContent = data.grado || "Recluta";
                    } else {
                        soldierNameEl.textContent = user.displayName || "Soldato";
                        soldierRankEl.textContent = "Recluta";
                    }
                });
            } else {
                soldierNameEl.innerHTML = `<a href="account.html" style="color:#ffd700; text-decoration:none;">Accedi</a>`;
                soldierRankEl.textContent = "Civile";
            }
        });
    </script>

    <!-- Script Mappa Interattiva -->
    <script>
        // Inizializza la mappa centrata sull'Europa
        const map = L.map('map', {
            center: [48.5, 13.0],
            zoom: 4,
            minZoom: 3,
            maxZoom: 10
        });

        // Sfondo cartografico scuro elegante (CartoDB Dark Matter senza etichette invasive)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        let selectedLayer = null;

        // Stile base delle regioni
        function defaultStyle() {
            return {
                fillColor: '#5a1820',
                weight: 1.2,
                opacity: 1,
                color: '#d4af37',
                fillOpacity: 0.45
            };
        }

        // Stile quando tocchi / selezioni una regione
        function highlightStyle() {
            return {
                fillColor: '#d4af37',
                weight: 2,
                opacity: 1,
                color: '#ffffff',
                fillOpacity: 0.75
            };
        }

        // Carica i confini delle regioni europee (Eurostat NUTS 2 / Regioni ufficiali)
        const geojsonUrl = 'https://raw.githubusercontent.com/eurostat/Nuts2json/master/pub/v2/2021/4326/20M/nutsrg_2.json';

        fetch(geojsonUrl)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading-overlay').style.display = 'none';

                const geojsonLayer = L.geoJSON(data, {
                    style: defaultStyle,
                    onEachFeature: function (feature, layer) {
                        const props = feature.properties;
                        // Nome regione (es. Lombardia, Bayern, Île-de-France, ecc.)
                        const regionName = props.na || props.NAME_LATN || props.id || "Regione Sconosciuta";
                        const countryCode = props.co || (props.id ? props.id.substring(0, 2) : "EU");

                        layer.on('click', function (e) {
                            // Ripristina lo stile della regione precedente
                            if (selectedLayer) {
                                geojsonLayer.resetStyle(selectedLayer);
                            }

                            // Evidenzia la nuova regione toccata
                            selectedLayer = e.target;
                            selectedLayer.setStyle(highlightStyle());
                            selectedLayer.bringToFront();

                            // Aggiorna il box in basso
                            document.getElementById('selected-region-name').textContent = regionName;
                            document.getElementById('selected-region-country').textContent = `Codice Settore: ${props.id || ''} (${countryCode})`;

                            // Mostra anche un popup sul punto toccato
                            L.popup()
                                .setLatLng(e.latlng)
                                .setContent(`<div class="popup-title">${regionName}</div><div style="font-size:0.78rem; margin-top:2px;">Settore: ${props.id || countryCode}</div>`)
                                .openOn(map);
                        });
                    }
                }).addTo(map);
            })
            .catch(err => {
                console.error("Errore caricamento regioni:", err);
                document.getElementById('loading-overlay').textContent = "ERRORE CARICAMENTO MAPPA";
            });
    </script>
</body>
</html>
