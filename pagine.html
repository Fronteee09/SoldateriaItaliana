<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagine e Archivi - Soldateria Italiana</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            padding: 20px 16px;
            background-color: #140608;
            color: #f5f0e6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bg-blur {
            position: fixed;
            inset: -20px;
            background-image: url('sfondosi.png');
            background-size: cover;
            background-position: center;
            filter: blur(7px) brightness(0.6);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel {
            background: rgba(54, 14, 19, 0.78);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: #d4af37;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #d8cfc0;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            background: rgba(20, 6, 8, 0.65);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 6px;
            color: #fff;
            font-size: 0.88rem;
            margin-bottom: 10px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        input:focus, textarea:focus {
            border-color: #d4af37;
        }

        .btn {
            padding: 10px 16px;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #d4af37;
            border-radius: 6px;
            color: #f7e7b4;
            font-family: 'Cinzel', serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #d4af37;
            color: #2b090d;
        }

        .btn-delete {
            background: rgba(239, 83, 80, 0.15);
            border-color: #ef5350;
            color: #ef9a9a;
            padding: 4px 9px;
            font-size: 0.72rem;
        }

        .btn-delete:hover {
            background: #ef5350;
            color: #fff;
        }

        .pages-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .page-card {
            background: rgba(54, 14, 19, 0.78);
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 8px;
        }

        .page-title {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: #d4af37;
        }

        .page-content {
            font-size: 0.9rem;
            color: #ece6da;
            line-height: 1.6;
            white-space: pre-line;
        }

        .page-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        .page-images img {
            width: 100%;
            max-height: 360px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid rgba(212, 175, 55, 0.35);
        }

        .back-link {
            color: #d4af37;
            font-size: 0.85rem;
            text-decoration: none;
            text-align: center;
            margin-top: 8px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>

    <div class="container">
        <header class="panel">
            <h1>Pagine Ufficiali</h1>
            <p class="subtitle">Documentazione, regolamenti e lore della Soldateria Italiana.</p>
        </header>

        <!-- PANNELLO CREAZIONE PAGINA (Solo Moderatore) -->
        <section id="mod-panel" class="panel hidden">
            <h2 style="font-family: 'Cinzel', serif; font-size: 1rem; color: #d4af37; margin-bottom: 10px;">
                + Crea Nuova Pagina
            </h2>
            <input type="text" id="page-title" placeholder="Titolo della pagina (es. Manuale del Soldato)">
            <textarea id="page-content" rows="4" placeholder="Testo della pagina..."></textarea>
            <textarea id="page-images" rows="2" placeholder="Link immagini (opzionale, uno per riga o separati da virgola)"></textarea>
            <button id="btn-create-page" class="btn">Pubblica Pagina</button>
        </section>

        <!-- LISTA DELLE PAGINE (Solo lettura per gli utenti) -->
        <main id="pages-container" class="pages-list">
            <!-- Contenuto dinamico -->
        </main>

        <a href="index.html" class="back-link">← Torna all'Alto Comando</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, deleteDoc, doc, 
            onSnapshot, query, orderBy 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCtSgXFtxyh5nOTw_LJYUQWxirKDEI5qRA",
            authDomain: "soldateria-italiana.firebaseapp.com",
            projectId: "soldateria-italiana",
            storageBucket: "soldateria-italiana.firebasestorage.app",
            messagingSenderId: "796071358350",
            appId: "1:796071358350:web:550d693197abee8f4e3edf",
            measurementId: "G-ZLK81VSLPG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const MOD_UID = "0jjzsNxpLhZKyyQmHx2RY6GGiUi2";
        let isMod = false;
        let allPages = [];

        const modPanel = document.getElementById('mod-panel');
        const pagesContainer = document.getElementById('pages-container');

        onAuthStateChanged(auth, (user) => {
            isMod = user && user.uid === MOD_UID;
            if (isMod) {
                modPanel.classList.remove('hidden');
            } else {
                modPanel.classList.add('hidden');
            }
            renderPages();
        });

        // Ascolta la collezione "pagine" ordinata per data di creazione
        const q = query(collection(db, "pagine"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            allPages = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            renderPages();
        });

        // Pubblica nuova pagina (Solo Moderatore)
        document.getElementById('btn-create-page').addEventListener('click', async () => {
            if (!isMod) return;
            const titolo = document.getElementById('page-title').value.trim();
            const testo = document.getElementById('page-content').value.trim();
            const rawImages = document.getElementById('page-images').value.trim();

            if (!titolo || !testo) {
                alert("Inserisci almeno il titolo e il testo della pagina.");
                return;
            }

            // Estrae eventuali link immagini separati da a-capo o virgola
            const immagini = rawImages
                ? rawImages.split(/[\n,]+/).map(url => url.trim()).filter(url => url.startsWith('http'))
                : [];

            await addDoc(collection(db, "pagine"), {
                titolo,
                testo,
                immagini,
                timestamp: Date.now()
            });

            document.getElementById('page-title').value = '';
            document.getElementById('page-content').value = '';
            document.getElementById('page-images').value = '';
        });

        function renderPages() {
            if (allPages.length === 0) {
                pagesContainer.innerHTML = `<div class="panel" style="text-align:center; font-size:0.9rem; color:#ccc;">Nessuna pagina pubblicata al momento.</div>`;
                return;
            }

            pagesContainer.innerHTML = allPages.map(page => {
                const imgsHtml = (page.immagini && page.immagini.length > 0)
                    ? `<div class="page-images">${page.immagini.map(src => `<img src="${src}" alt="Immagine documento" loading="lazy">`).join('')}</div>`
                    : '';

                const deleteBtnHtml = isMod
                    ? `<button class="btn btn-delete" onclick="eliminaPagina('${page.id}')">Elimina</button>`
                    : '';

                return `
                    <article class="page-card">
                        <div class="page-header">
                            <h3 class="page-title">${page.titolo}</h3>
                            ${deleteBtnHtml}
                        </div>
                        <div class="page-content">${page.testo}</div>
                        ${imgsHtml}
                    </article>
                `;
            }).join('');
        }

        window.eliminaPagina = async (id) => {
            if (!isMod) return;
            if (confirm("Vuoi davvero eliminare questa pagina?")) {
                await deleteDoc(doc(db, "pagine", id));
            }
        };
    </script>
</body>
</html>
