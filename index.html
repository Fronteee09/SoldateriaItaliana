<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soldateria Italiana - Alto Comando</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 16px;
            position: relative;
            background-color: #140608;
        }

        /* Sfondo sfocato */
        .bg-blur {
            position: fixed;
            inset: -20px;
            background-image: url('sfondosi.png');
            background-size: cover;
            background-position: center;
            filter: blur(7px) brightness(0.65);
            z-index: -1;
        }

        /* Box centrale leggero e meno invadente */
        .main-box {
            width: 100%;
            max-width: 390px;
            background: rgba(54, 14, 19, 0.72);
            border: 1px solid rgba(212, 175, 55, 0.55);
            border-radius: 10px;
            padding: 24px 20px;
            text-align: center;
            color: #f5f0e6;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .logo {
            width: 80px;
            height: auto;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            color: #e5c158;
            letter-spacing: 0.15em;
            margin-bottom: 14px;
            opacity: 0.85;
        }

        .description {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #e2dcd0;
            margin-bottom: 20px;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 11px 16px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.6);
            border-radius: 6px;
            color: #f7e7b4;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn:hover, .btn:active {
            background: #d4af37;
            color: #2b090d;
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>

    <main class="main-box">
        <img src="logosi.png" alt="Stemma Soldateria Italiana" class="logo">
        
        <h1>Soldateria Italiana</h1>
        <div class="subtitle">ALTO COMANDO GENERALE</div>

        <p class="description">
            Portale di reclutamento e coordinamento della <strong>Soldateria Italiana</strong>. 
            Scegli il tuo Corpo d'Armata e consulta i registri ufficiali.
        </p>

        <nav class="nav-buttons">
            <a href="account.html" class="btn">Account</a>
            <a href="annunci.html" class="btn">Annunci</a>
            <a href="pagine.html" class="btn">Pagine</a>
            <a href="registri.html" class="btn">Registri</a>
            <a href="corpidarmata.html" class="btn">Corpi d'Armata</a>
        </nav>
    </main>

</body>
</html>
